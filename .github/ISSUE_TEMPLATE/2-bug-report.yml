name: 🐛 缺陷报告
description: 创建一份报告，帮助我们改进
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        感谢你抽出时间填写这份缺陷报告！

  - type: textarea
    id: description
    attributes:
      label: 描述缺陷
      description: 请详细描述该缺陷
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 复现该问题的操作步骤
      placeholder: |
        1. 打开 '...'
        2. 点击 '....'
        3. 滚动到 '....'
        4. 看到报错
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如有必要，请添加截图
    validations:
      required: false

  - type: textarea
    id: computer-info
    attributes:
      label: 电脑信息
      description: |
        示例：
          - **操作系统版本**：[例如 Windows 11 家庭版]
          - **扩展版本**：[例如 5.6.0]
          - **VSCode 版本**：[例如 1.91.1]
      value: |
          - **操作系统版本**：
          - **扩展版本**：
          - **VSCode 版本**：

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 关于该问题的其他补充信息。
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: 行为准则
      description: 提交此 Issue 即表示你同意遵守我们的[行为准则](../../CODE_OF_CONDUCT.md)。
      options:
        - label: 我同意遵守本项目的**行为准则**
          required: true
